name: Release

# Al subir una etiqueta vX.Y.Z, compila el APK y publica un Release con él adjunto.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "MiMente-${GITHUB_REF_NAME#v}.apk"

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Mi Mente ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: MiMente-*.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiMente-apk
          path: MiMente-*.apk
