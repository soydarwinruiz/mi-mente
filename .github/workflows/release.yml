name: Release

# Compila el APK y publica (o actualiza) el Release de la versión indicada en
# app/build.gradle.kts (versionName). Se ejecuta cuando cambia la versión, las
# notas o este flujo en main, al subir una etiqueta vX.Y.Z, o a mano.
on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - .github/release-notes.md
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versión
        id: version
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "MiMente-${{ steps.version.outputs.name }}.apk"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Mi Mente ${{ steps.version.outputs.name }}
          body_path: .github/release-notes.md
          files: MiMente-*.apk
          make_latest: true

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiMente-apk
          path: MiMente-*.apk
